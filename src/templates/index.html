<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="/static/styles.css" rel="stylesheet">
    <title>Music Generator</title>
</head>

<body class="container">
    <div class="row">
        <div class="col">
            <div class="section-container">
                <div class="card">
                    <div class="card-body">
                        <div>Camera 1</div>
                        <input type="range" class="form-range" id="slider1" min="-1.0" max="1.0" step="1.0" value="0">
                        <div>Camera 2</div>
                        <input type="range" class="form-range" id="slider2" min="-1.0" max="1.0" step="1.0" value="0">
                        <div>Camera 3</div>
                        <input type="range" class="form-range" id="slider3" min="-1.0" max="1.0" step="1.0" value="0">
                        <button class="btn btn-primary" type="button" onclick="appendArousal()">Append</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <hr>
    <div class="row">
        <div class="col">
            <div class="section-container">
                <midi-player id="midiPlayer" sound-font visualizer="#midiVisualizer"></midi-player>
                <div class="center-container">
                    <div class="spinner-grow text-primary" role="status" id="loading_spinner" style="display: none">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
                <midi-visualizer type="piano-roll" id="midiVisualizer"></midi-visualizer>
            </div>
            <div>
                <button class="btn btn-primary" type="button" onclick="reloadPage()">Reload</button>
            </div>
        </div>
    </div>

    <div class="modal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Notification</h5>
            </div>
            <div class="modal-body"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
          </div>
        </div>
    </div>
    
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" integrity="sha384-2huaZvOR9iDzHqslqwpR87isEmrfxqyWOF7hr7BY6KG0+hVKLoEXMPUJw3ynWuhO" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/combine/npm/tone@14.7.58,npm/@magenta/music@1.23.1/es6/core.js,npm/focus-visible@5,npm/html-midi-player@1.5.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/static/script.js"></script>
</body>
</html>
