<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="/static/styles.css" rel="stylesheet">
    <title>Music Generator</title>
</head>

<body class="container">
    <div class="row">
        <div class="col">
            <form id="generateForm" onsubmit="submitForm(); return false;">
                <div class="section-container">
                    <div style="display: flex; align-items: center;">
                        <div><b>Arousal Value</b></div>
                        <button class="btn btn-primary" data-bs-toggle="collapse" id="valueSetterBtn" type="button" style="margin-left: auto;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16">
                                <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
                                <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"/>
                            </svg>
                        </button>
                    </div>
                    <input type="range" class="form-range" id="mainSlider" min="0" max="3072" step="512" value="0">
                    <div id="arousal_list"></div>
                    
                    <div class="center-container">
                        <div class="collapse" id="valueSetter" style="margin-top: 1rem;">
                            <div class="card">
                                <div class="card-body">
                                    <div>Camera 1</div>
                                    <input type="range" class="form-range" id="slider1" min="-1.0" max="1.0" step="1.0" value="0">
                                    <div>Camera 2</div>
                                    <input type="range" class="form-range" id="slider2" min="-1.0" max="1.0" step="1.0" value="0">
                                    <div>Camera 3</div>
                                    <input type="range" class="form-range" id="slider3" min="-1.0" max="1.0" step="1.0" value="0">
                                    <button class="btn btn-primary" type="button" onclick="appendArousal()">Append</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div>
                    <button class="btn btn-primary" type="submit">Generate</button>
                </div>
            </form>
        </div>
    </div>
    <hr>
    <div class="row">
        <div class="col">
            <div class="section-container">
                <midi-player id="midiPlayer" sound-font visualizer="#midiVisualizer"></midi-player>
                <div class="center-container">
                    <div class="spinner-grow text-primary" role="status" id="loadingSpinner" style="display: none;">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
                <midi-visualizer type="piano-roll" id="midiVisualizer"></midi-visualizer>
            </div>
            <div>
                <button class="btn btn-primary" type="button" onclick="reloadPage()">Reload</button>
            </div>
        </div>
    </div>

    <div class="modal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Notification</h5>
            </div>
            <div class="modal-body"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
          </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/combine/npm/tone@14.7.58,npm/@magenta/music@1.23.1/es6/core.js,npm/focus-visible@5,npm/html-midi-player@1.5.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="/static/script.js"></script>
</body>
</html>
